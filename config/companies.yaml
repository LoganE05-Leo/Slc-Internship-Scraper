# ~60 companies within roughly 30 miles of downtown Salt Lake City.
# Weighted toward finance / accounting / fintech, plus large regional
# employers known to run finance/accounting internships.
#
# ats: auto means detect_ats.py will resolve it. Run:
#   python detect_ats.py
# which writes config/companies.resolved.yaml (preferred by src/main.py).
#
# careers_url values were verified via web research on 2026-08-05, with a
# second pass on 2026-08-08 specifically hunting for supported-ATS boards
# behind companies that first resolved to something else (subsidiary
# boards, regional offices, etc.) -- see individual per-company comments
# below for anything non-obvious (Vivint, Young Living, eBay, KPMG).
#
# Remaining companies that don't use one of the 6 supported ATS platforms
# (they'll fall back to generic HTML scraping, which is best-effort):
#   - Zions Bancorporation: custom portal (SelectMinds)
#   - Goldman Sachs: proprietary "Higher" platform
#   - WCF Insurance: ApplicantPro
#   - American Express: Avature
#   - Ally Financial: Avature
#   - EY: SAP SuccessFactors
#   - Eide Bailly: custom-branded, backend unconfirmed
#   - CBIZ: Oracle Recruiting Cloud
#   - Tanner LLC: JazzHR
#   - Cotiviti: iCIMS
#   - L3Harris: TalentBrew
#   - Larry H. Miller Company, Sorenson Communications: UKG/UltiPro
#   - Savage Services: Dayforce HCM
#   - USANA: Jobvite
#   - University of Utah: PeopleAdmin
#   - Salt Lake County: iCIMS (careers-slco.icims.com)
#   - Salt Lake Community College: NEOGOV/GovernmentJobs
#   - State of Utah: Cornerstone OnDemand
#   - Utah Transit Authority: Talemetry/Radancy
#   - Zonos, Deloitte, Haynie & Company, Cook Martin Poulson: platform
#     unconfirmed or self-hosted
#   - KPMG: US firm is on Avature; a jobs.lever.co/kpmgnz board exists but
#     is KPMG New Zealand's, deliberately not used (see comment below)
# Progrexion was dropped: PGX Holdings filed Chapter 11 in 2023 and the
# domain no longer resolves -- no successor careers site found.

companies:
  # --- Banking / finance / fintech ---
  - name: Zions Bancorporation
    careers_url: https://careers.zionsbancorp.com/
    ats: auto
  - name: Goldman Sachs
    careers_url: https://higher.gs.com/
    ats: auto
  - name: WCF Insurance
    careers_url: https://wcfgroup.applicantpro.com/
    ats: auto
  - name: Mountain America Credit Union
    # Public-facing careers page is a JS front-end; real listings live on
    # this Workday board. Pinned explicitly (not auto) since it's confirmed.
    careers_url: https://macu.wd5.myworkdayjobs.com/MACU_Careers
    ats: workday
    tenant: macu
    dc: wd5
    site: MACU_Careers
  - name: Progressive Leasing
    careers_url: https://progleasing.wd5.myworkdayjobs.com/ProgLeasingCareers
    ats: auto
  - name: MX
